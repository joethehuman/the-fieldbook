name: Fieldbook checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ui
      - run: pnpm test
      - run: pnpm build:demo
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-test-key
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - run: pnpm test:authoring
      - run: pnpm test:reading
      - run: pnpm test:accounts
      - run: pnpm test:search
      - run: pnpm test:guests
      - run: pnpm test:reporting
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review
          path: |
            playwright-report/
            test-results/
          retention-days: 14
