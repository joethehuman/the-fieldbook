# Add these entries under services in the Marketplace image's volumes/api/kong.yml.
# Supabase Auth enforces OAuth client authentication, PKCE, user sessions and rate limits.
- name: auth-v1-open-oauth-server
  url: http://auth:9999/oauth
  routes:
    - name: auth-v1-open-oauth-server
      strip_path: true
      paths:
        - /auth/v1/oauth
  plugins:
    - name: cors
- name: auth-v1-open-oauth-metadata
  url: http://auth:9999/.well-known
  routes:
    - name: auth-v1-open-oauth-metadata
      strip_path: true
      paths:
        - /auth/v1/.well-known
  plugins:
    - name: cors
