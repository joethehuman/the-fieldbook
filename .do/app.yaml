# Candidate DO recipe. Read docs/installation.md before supplying private values.
# Keep populated specs outside Git. Choose sizes for your workload before creating.
# One Fieldbook instance: distributed Next.js cache coordination is not configured.
name: fieldbook
region: sfo
domains:
  - domain: YOUR_APP_DOMAIN
    type: PRIMARY
disable_edge_cache: true
vpc:
  id: YOUR_VPC_UUID
# Attach an existing dedicated Managed PostgreSQL 17 cluster; never a dev database.
databases:
  - name: backend-db
    engine: PG
    version: "17"
    production: true
    cluster_name: YOUR_MANAGED_CLUSTER
    db_name: defaultdb
    db_user: doadmin
services:
  - name: fieldbook
    git: &source
      repo_clone_url: https://github.com/YOUR_OWNER/the-fieldbook.git
      branch: YOUR_DEPLOYMENT_BRANCH
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /fieldbook-build.json
    termination:
      drain_seconds: 30
      grace_period_seconds: 90
    envs:
      - key: FIELDBOOK_APP_KIND
        value: installed
      - key: FIELDBOOK_HOST
        value: node
      - key: FIELDBOOK_URL
        value: ${APP_URL}
      - key: FIELDBOOK_OWNER_EMAIL
        value: YOUR_OWNER_EMAIL
      - key: FIELDBOOK_BUILD_REVISION
        value: ${_self.COMMIT_HASH}
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: ${APP_URL}/backend
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: YOUR_ANON_KEY
      - key: SUPABASE_SECRET_KEY
        value: YOUR_SERVICE_ROLE_KEY
        type: SECRET
        scope: RUN_TIME
      # Optional Ask AI. Keep none until configuring a compatible custom router.
      - key: FIELDBOOK_AI_ROUTER
        value: none
      # FIELDBOOK_AI_ROUTER=digitalocean, DIGITALOCEAN_INFERENCE_ROUTER=router:name
      # Add DIGITALOCEAN_MODEL_ACCESS_KEY and DIGITALOCEAN_ROUTER_READ_TOKEN
      # as component RUN_TIME secrets. Discovery needs genai:read and DO-required
      # read-only dependencies. Set DIGITALOCEAN_VERIFIED_MODELS to tested model IDs.
  - name: auth
    git: *source
    dockerfile_path: Dockerfile.supabase-auth
    http_port: 9999
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
    envs:
      - key: DATABASE_CA_CERT
        value: ${backend-db.CA_CERT}
        scope: RUN_TIME
      - key: GOTRUE_DB_DRIVER
        value: postgres
      # Use the database's certificate-matching DNS hostname, never an IP/pooler.
      # Passwords generated by generate-self-hosted-keys.mjs are URL-safe hex.
      - key: GOTRUE_DB_DATABASE_URL
        value: postgres://supabase_auth_admin:YOUR_AUTH_DATABASE_PASSWORD@YOUR_DATABASE_DNS:25060/defaultdb?sslmode=verify-full&sslrootcert=/tmp/fieldbook-db-ca.crt
        type: SECRET
        scope: RUN_TIME
      - key: GOTRUE_DB_MAX_POOL_SIZE
        value: "5"
      - key: GOTRUE_DB_NAMESPACE
        value: auth
      - key: GOTRUE_API_HOST
        value: 0.0.0.0
      - key: GOTRUE_API_PORT
        value: "9999"
      - key: API_EXTERNAL_URL
        value: ${APP_URL}/backend/auth/v1
      - key: GOTRUE_SITE_URL
        value: ${APP_URL}
      - key: GOTRUE_URI_ALLOW_LIST
        value: ${APP_URL}/auth/callback
      - key: GOTRUE_JWT_ISSUER
        value: ${APP_URL}/backend/auth/v1
      - key: GOTRUE_JWT_AUD
        value: authenticated
      - key: GOTRUE_JWT_DEFAULT_GROUP_NAME
        value: authenticated
      - key: GOTRUE_JWT_ADMIN_ROLES
        value: service_role
      - key: GOTRUE_JWT_EXP
        value: "3600"
      - key: GOTRUE_JWT_SECRET
        value: YOUR_JWT_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: GOTRUE_JWT_KEYS
        value: YOUR_JWT_KEYS
        type: SECRET
        scope: RUN_TIME
      # Keep true until the application schema is installed. Then set false;
      # Fieldbook controls admission after Google identity verification.
      - key: GOTRUE_DISABLE_SIGNUP
        value: "true"
      - key: GOTRUE_EXTERNAL_EMAIL_ENABLED
        value: "false"
      - key: GOTRUE_EXTERNAL_PHONE_ENABLED
        value: "false"
      - key: GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED
        value: "false"
      - key: GOTRUE_EXTERNAL_GOOGLE_ENABLED
        value: "true"
      - key: GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID
        value: YOUR_GOOGLE_CLIENT_ID
      - key: GOTRUE_EXTERNAL_GOOGLE_SECRET
        value: YOUR_GOOGLE_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI
        value: ${APP_URL}/backend/auth/v1/callback
      # Set both OAuth flags true only when enabling optional Fieldbook MCP.
      - key: GOTRUE_OAUTH_SERVER_ENABLED
        value: "false"
      - key: GOTRUE_OAUTH_SERVER_ALLOW_DYNAMIC_REGISTRATION
        value: "false"
      - key: GOTRUE_OAUTH_SERVER_AUTHORIZATION_PATH
        value: /oauth/consent
      # Enable these AFTER setup-self-hosted.mjs creates the hook.
      - key: GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED
        value: "false"
      - key: GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI
        value: pg-functions://postgres/public/fb_access_token_hook
  - name: rest
    git: *source
    dockerfile_path: Dockerfile.supabase-rest
    http_port: 3000
    internal_ports: [3001]
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /ready
      port: 3001
    envs:
      - key: DATABASE_CA_CERT
        value: ${backend-db.CA_CERT}
        scope: RUN_TIME
      - key: PGRST_DB_URI
        value: postgres://authenticator:YOUR_REST_DATABASE_PASSWORD@YOUR_DATABASE_DNS:25060/defaultdb?sslmode=verify-full&sslrootcert=/tmp/fieldbook-db-ca.crt
        type: SECRET
        scope: RUN_TIME
      - key: PGRST_DB_SCHEMAS
        value: public
      - key: PGRST_DB_EXTRA_SEARCH_PATH
        value: public,extensions
      - key: PGRST_DB_ANON_ROLE
        value: anon
      - key: PGRST_DB_POOL
        value: "5"
      - key: PGRST_SERVER_PORT
        value: "3000"
      - key: PGRST_ADMIN_SERVER_PORT
        value: "3001"
      - key: PGRST_ADMIN_SERVER_HOST
        value: 0.0.0.0
      - key: PGRST_JWT_SECRET
        value: YOUR_JWT_JWKS
        type: SECRET
        scope: RUN_TIME
  - name: storage
    git: *source
    dockerfile_path: Dockerfile.supabase-storage
    http_port: 5000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /status
    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgres://supabase_storage_admin:YOUR_STORAGE_DATABASE_PASSWORD@YOUR_DATABASE_DNS:25060/defaultdb?sslmode=verify-full&sslrootcert=/tmp/fieldbook-db-ca.crt
        type: SECRET
        scope: RUN_TIME
      # The tenant pool accepts PEM; PubSub also needs verified TLS in the URL.
      # The wrapper materializes the same CA for every database client.
      - key: DATABASE_CA_CERT
        value: ${backend-db.CA_CERT}
        scope: RUN_TIME
      - key: DATABASE_SSL_ROOT_CERT
        value: ${backend-db.CA_CERT}
        scope: RUN_TIME
      - key: DB_INSTALL_ROLES
        value: "false"
      - key: DB_ALLOW_MIGRATION_REFRESH
        value: "false"
      - key: DATABASE_SEARCH_PATH
        value: storage,public,extensions
      - key: DATABASE_MAX_CONNECTIONS
        value: "5"
      - key: AUTH_JWT_SECRET
        value: YOUR_JWT_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: JWT_JWKS
        value: YOUR_JWT_JWKS
        type: SECRET
        scope: RUN_TIME
      - key: ANON_KEY
        value: YOUR_ANON_KEY
      - key: SERVICE_KEY
        value: YOUR_SERVICE_ROLE_KEY
        type: SECRET
        scope: RUN_TIME
      - key: TENANT_ID
        value: fieldbook
      - key: STORAGE_PUBLIC_URL
        value: ${APP_URL}
      # Use the explicit /upload/resumable ingress alias below for Location URLs.
      - key: REQUEST_ALLOW_X_FORWARDED_PATH
        value: "false"
      - key: STORAGE_BACKEND
        value: s3
      - key: GLOBAL_S3_BUCKET
        value: YOUR_PRIVATE_SPACES_BUCKET
      - key: GLOBAL_S3_ENDPOINT
        value: https://YOUR_SPACES_REGION.digitaloceanspaces.com
      - key: GLOBAL_S3_FORCE_PATH_STYLE
        value: "true"
      - key: REGION
        value: YOUR_SPACES_REGION
      - key: AWS_ACCESS_KEY_ID
        value: YOUR_BUCKET_SCOPED_ACCESS_KEY
        type: SECRET
        scope: RUN_TIME
      - key: AWS_SECRET_ACCESS_KEY
        value: YOUR_BUCKET_SCOPED_SECRET_KEY
        type: SECRET
        scope: RUN_TIME
      - key: TUS_PART_SIZE
        value: "6"
      # Seconds for path-bound authorization; milliseconds for resumable state.
      # Storage's default 60-second signature is too short for large uploads.
      - key: UPLOAD_SIGNED_URL_EXPIRATION_TIME
        value: "7200"
      - key: TUS_URL_EXPIRY_MS
        value: "7200000"
      - key: TUS_ALLOW_S3_TAGS
        value: "false"
      - key: TUS_LOCK_TYPE
        value: postgres
      # Operator-owned storage limit; this example allows files up to 5 GiB.
      - key: FILE_SIZE_LIMIT
        value: "5368709120"
      - key: ENABLE_IMAGE_TRANSFORMATION
        value: "false"
jobs:
  - name: cleanup
    git: *source
    dockerfile_path: Dockerfile.cleanup
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    kind: SCHEDULED
    schedule:
      cron: "17 * * * *"
      time_zone: UTC
    envs:
      - key: FIELDBOOK_URL
        value: ${APP_URL}
      - key: FIELDBOOK_CLEANUP_SECRET
        value: YOUR_BACKEND_WORKER_SECRET
        type: SECRET
        scope: RUN_TIME
ingress:
  rules:
    # RFC 8414 discovery inserts .well-known BEFORE the issuer's path.
    - match:
        path:
          prefix: /.well-known/oauth-authorization-server/backend/auth/v1
      component:
        name: auth
        rewrite: /.well-known/oauth-authorization-server
    - match:
        path:
          prefix: /backend/auth/v1
      component:
        name: auth
        rewrite: /
    - match:
        path:
          prefix: /backend/rest/v1
      component:
        name: rest
        rewrite: /
    - match:
        path:
          prefix: /backend/storage/v1
      component:
        name: storage
        rewrite: /
    # Storage's canonical TUS Location is rooted at /upload/resumable. Preserve
    # it so PATCH/HEAD/DELETE continue directly after the initial signed POST.
    - match:
        path:
          prefix: /upload/resumable
      component:
        name: storage
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: fieldbook
