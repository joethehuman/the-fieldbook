# Override for the Supabase Marketplace image's managed PostgreSQL configuration.
# Supply these values in the backend's private .env, after generating JWT_KEYS/JWT_JWKS.
services:
  auth:
    environment:
      API_EXTERNAL_URL: ${FIELDBOOK_PUBLIC_SUPABASE_URL:?Set the public backend API URL}
      GOTRUE_SITE_URL: ${FIELDBOOK_URL:?Set the public application URL}
      GOTRUE_URI_ALLOW_LIST: ${FIELDBOOK_URL}/auth/callback
      GOTRUE_JWT_ISSUER: ${FIELDBOOK_PUBLIC_SUPABASE_URL}/auth/v1
      GOTRUE_JWT_KEYS: ${JWT_KEYS:?Generate the asymmetric signing keys}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${FIELDBOOK_PUBLIC_SUPABASE_URL}/auth/v1/callback
      GOTRUE_OAUTH_SERVER_ENABLED: ${FIELDBOOK_MCP_ENABLED:-false}
      GOTRUE_OAUTH_SERVER_ALLOW_DYNAMIC_REGISTRATION: ${FIELDBOOK_MCP_ENABLED:-false}
      GOTRUE_OAUTH_SERVER_AUTHORIZATION_PATH: /oauth/consent
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: pg-functions://postgres/public/fb_access_token_hook
  rest:
    environment:
      PGRST_JWT_SECRET: ${JWT_JWKS:?Generate the verification keys}
  realtime:
    environment:
      API_JWT_JWKS: ${JWT_JWKS}
  storage:
    environment:
      JWT_JWKS: ${JWT_JWKS}
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/digitalocean-ca.pem
      STORAGE_PUBLIC_URL: ${FIELDBOOK_PUBLIC_SUPABASE_URL}/storage/v1
      STORAGE_BACKEND: s3
      GLOBAL_S3_BUCKET: ${FIELDBOOK_SPACES_BUCKET:?Set the private media bucket}
      GLOBAL_S3_ENDPOINT: https://${FIELDBOOK_SPACES_REGION:?Set the bucket region}.digitaloceanspaces.com
      GLOBAL_S3_PROTOCOL: https
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${FIELDBOOK_SPACES_ACCESS_KEY:?Set the bucket-scoped access key ID}
      AWS_SECRET_ACCESS_KEY: ${FIELDBOOK_SPACES_SECRET_KEY:?Set the bucket-scoped secret key}
      REGION: ${FIELDBOOK_SPACES_REGION}
    volumes:
      - ./volumes/certificates/digitalocean-ca.pem:/etc/ssl/certs/digitalocean-ca.pem:ro
